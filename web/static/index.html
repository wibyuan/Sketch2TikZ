<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch2TikZ — AI Sketch to Vector</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-brand">
            <span class="logo">✦</span>
            <h1>Sketch2TikZ</h1>
        </div>
        <div class="header-actions">
            <button id="btn-history" class="btn-ghost" title="历史记录">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                历史
            </button>
        </div>
    </header>

    <!-- History Sidebar -->
    <aside id="history-panel" class="history-panel hidden">
        <div class="history-header">
            <h3>生成历史</h3>
            <button id="btn-close-history" class="btn-icon">✕</button>
        </div>
        <div id="history-list" class="history-list">
            <div class="history-empty">暂无历史记录</div>
        </div>
    </aside>

    <!-- Main Layout -->
    <main class="main-layout">
        <!-- Left Panel: Upload & Controls -->
        <section class="left-panel">
            <!-- Upload Zone -->
            <div id="upload-zone" class="upload-zone">
                <input type="file" id="file-input" accept="image/*" hidden>
                <div class="upload-placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p>拖拽手绘图到此处，或 <span class="link">点击上传</span></p>
                    <small>支持 PNG, JPG, WEBP · 最大 10MB</small>
                </div>
                <div id="upload-preview" class="upload-preview hidden">
                    <img id="preview-img" src="" alt="uploaded sketch">
                    <button id="btn-remove-file" class="btn-remove" title="移除">✕</button>
                </div>
            </div>

            <!-- Custom Prompt -->
            <div class="control-group">
                <label>自定义描述（可选）</label>
                <textarea id="custom-prompt" rows="3" placeholder="留空则自动分析图像。你也可以手动输入描述来指导生成，例如：一个带箭头的流程图，包含开始、处理、结束三个节点"></textarea>
            </div>

            <!-- Progress -->
            <div id="progress-area" class="progress-area hidden">
                <div class="progress-header">
                    <span id="progress-label">准备中...</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                </div>
                <div id="progress-message" class="progress-message"></div>
            </div>

            <!-- Generate Button -->
            <button id="btn-generate" class="btn-primary" disabled>
                <span class="btn-text">开始生成</span>
                <svg class="btn-icon-spin hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            </button>
        </section>

        <!-- Right Panel: Preview & Results -->
        <section class="right-panel">
            <!-- Result View -->
            <div id="result-view" class="result-view hidden">
                <!-- Image Preview -->
                <div class="preview-card">
                    <div class="card-header">
                        <h3>渲染预览</h3>
                        <div class="card-actions">
                            <button id="btn-dl-pdf" class="btn-small">下载 PDF</button>
                            <button id="btn-dl-png" class="btn-small">下载 PNG</button>
                        </div>
                    </div>
                    <div class="preview-frame">
                        <img id="result-img" src="" alt="rendered output">
                    </div>
                </div>

                <!-- Score Bar -->
                <div id="score-bar" class="score-bar hidden">
                    <div class="score-item">
                        <span class="score-label">质量评分</span>
                        <span id="score-value" class="score-value">—</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">诊断</span>
                        <span id="score-diagnosis" class="score-diagnosis">—</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">耗时</span>
                        <span id="score-time" class="score-time">—</span>
                    </div>
                </div>

                <!-- Code Editor -->
                <div class="code-card">
                    <div class="card-header">
                        <h3>TikZ 代码</h3>
                        <div class="card-actions">
                            <button id="btn-copy-code" class="btn-small">复制</button>
                            <button id="btn-dl-tex" class="btn-small">下载 .tex</button>
                        </div>
                    </div>
                    <div class="code-editor-wrapper">
                        <textarea id="code-editor" spellcheck="false" placeholder="生成的 TikZ LaTeX 代码将显示在这里..."></textarea>
                    </div>
                </div>

                <!-- Comparison Card: choose which version to keep -->
                <div id="comparison-card" class="comparison-card hidden">
                    <div class="comparison-header">
                        <h3>选择保留的结果</h3>
                        <p>选择更满意的一个版本，后续优化将基于该版本继续</p>
                    </div>
                    <div class="comparison-grid">
                        <div class="comparison-item" id="comp-item-a">
                            <div class="comp-badge">版本 A（上一轮）</div>
                            <div class="comp-preview">
                                <img id="comp-img-a" src="" alt="version A">
                            </div>
                            <div class="comp-meta">
                                <span class="comp-score" id="comp-score-a">—</span>
                            </div>
                            <button id="btn-select-a" class="btn-secondary btn-select">保留此版本</button>
                        </div>
                        <div class="comparison-divider">VS</div>
                        <div class="comparison-item" id="comp-item-b">
                            <div class="comp-badge badge-current">版本 B（当前生成）</div>
                            <div class="comp-preview">
                                <img id="comp-img-b" src="" alt="version B">
                            </div>
                            <div class="comp-meta">
                                <span class="comp-score" id="comp-score-b">—</span>
                            </div>
                            <button id="btn-select-b" class="btn-primary btn-select">保留此版本</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state">
                <div class="empty-illustration">
                    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
                    </svg>
                </div>
                <h2>准备好将手绘图转换为 TikZ 代码</h2>
                <p>上传一张手绘草图，AI 会自动分析并生成精确的 LaTeX TikZ 矢量代码。</p>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <span id="toast-msg"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
